<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Red+Hat+Display:wght@400;500;600;700;800&display=swap">
  <style>
    body { margin: 0; }
    a { color: #00C853; } a:hover { color: #16a34a; }
    .grain {
      position: absolute; inset: 0; pointer-events: none; opacity: 0.06;
      mix-blend-mode: overlay;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>");
      background-size: 160px 160px;
    }
  </style>
</helmet>
<div style="position: relative; width: 1080px; height: 1920px; overflow: hidden; background: linear-gradient(178deg, {{bgTop}} 0%, {{bgMid}} 52%, {{bgBot}} 100%); font-family: {{font}};">

  <div style="position: absolute; inset: 0; background: radial-gradient(ellipse 74% 34% at 50% 24%, {{bloom}} 0%, rgba(0,0,0,0) 72%);"></div>

  <div style="position: absolute; left: 0; right: 0; top: 270px; display: flex; justify-content: center; padding: 0 60px;">
    <div style="font-size: 52px; font-weight: 600; line-height: 1.18; letter-spacing: -0.028em; color: {{ink}}; text-align: center; max-width: 960px;">Open the app.<br>Widdo already knows what needs you.</div>
  </div>

  <div style="position: absolute; left: 150px; top: 430px; width: 780px; height: 1490px; border-radius: 78px; background: #08120D; padding: 14px; box-sizing: border-box; box-shadow: 0 60px 130px rgba(0,0,0,0.55), 0 0 0 2px rgba(255,255,255,0.10);">
    <div style="width: 100%; height: 100%; border-radius: 64px; overflow: hidden; background: #F3F6F2; padding: 56px 36px 0; box-sizing: border-box; display: flex; flex-direction: column; gap: 34px;">
      <div style="display: flex; flex-direction: column; gap: 10px;">
        <div style="font-size: 32px; font-weight: 500; color: #5B6B62;">Tuesday, August 18</div>
        <div style="font-size: 58px; font-weight: 700; line-height: 1.08; letter-spacing: -0.032em; color: #14231C;">Good morning,<br>Miguel</div>
      </div>

      <div style="border-radius: 45px; background: #FFFFFF; padding: 18px 10px; display: flex; flex-direction: column;">
      <div style="border-radius: 37px; padding: 24px 26px; display: flex; align-items: center; gap: 24px;">
        <svg viewBox="0 0 24 24" width="44" height="44" fill="none" stroke="#5B6B62" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.2a8.8 8.8 0 1 0 0 17.6 8.8 8.8 0 0 0 0-17.6 M12 7.2v5l3.2 2"></path></svg>
        <div style="font-size: 33px; font-weight: 500; letter-spacing: -0.02em; color: #1B2B24; flex-grow: 1;">3 sessions today</div>
        <div style="font-size: 36px; font-weight: 700; letter-spacing: -0.025em; color: #14231C;">7:00 AM</div>
      </div>
      <div style="border-radius: 37px; padding: 24px 26px; display: flex; align-items: center; gap: 24px;">
        <svg viewBox="0 0 24 24" width="44" height="44" fill="none" stroke="#DC2626" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.4L2.6 20h18.8z M12 10v4 M12 17.2h.01"></path></svg>
        <div style="font-size: 33px; font-weight: 500; letter-spacing: -0.02em; color: #1B2B24; flex-grow: 1;">12 families overdue</div>
        <div style="font-size: 36px; font-weight: 700; letter-spacing: -0.025em; color: #DC2626;">$1,840</div>
      </div>
      <div style="background: #FFFBEB; border: 1.5px solid #FEF3C7; border-radius: 37px; padding: 24px 26px; display: flex; align-items: center; gap: 24px;">
        <svg viewBox="0 0 24 24" width="44" height="44" fill="none" stroke="#D97706" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-2-1.6-2 1.6-2-1.6-2 1.6-2-1.6-2 1.6z M9 8.5h6 M9 12.5h6"></path></svg>
        <div style="font-size: 33px; font-weight: 500; letter-spacing: -0.02em; color: #1B2B24; flex-grow: 1;">114 receipts waiting</div>
        <div style="font-size: 36px; font-weight: 700; letter-spacing: -0.025em; color: #D97706;">$8,400</div>
      </div>
      <div style="border-radius: 37px; padding: 24px 26px; display: flex; align-items: center; gap: 24px;">
        <svg viewBox="0 0 24 24" width="44" height="44" fill="none" stroke="#5B6B62" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17.4l5.6-5.6 3.4 3.4L21 6.6 M15.6 6.6H21v5.4"></path></svg>
        <div style="font-size: 33px; font-weight: 500; letter-spacing: -0.02em; color: #1B2B24; flex-grow: 1;">Attendance down</div>
        <div style="font-size: 36px; font-weight: 700; letter-spacing: -0.025em; color: #14231C;">18%</div>
      </div>
      <div style="border-radius: 37px; padding: 24px 26px; display: flex; align-items: center; gap: 24px;">
        <svg viewBox="0 0 24 24" width="44" height="44" fill="none" stroke="#5B6B62" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21h16v-8H4z M4 13c2 0 2-2 4-2s2 2 4 2 2-2 4-2 2 2 4 2 M8 8V4.5 M12 8V4 M16 8V4.5"></path></svg>
        <div style="font-size: 33px; font-weight: 500; letter-spacing: -0.02em; color: #1B2B24; flex-grow: 1;">2 birthdays</div>
        <div style="font-size: 36px; font-weight: 700; letter-spacing: -0.025em; color: #14231C;">Ana, Luis</div>
      </div>
      </div>

      <div style="border-radius: 37px; background: #EAF0EA; padding: 30px 32px; font-size: 32px; font-weight: 500; line-height: 1.3; letter-spacing: -0.018em; color: #1B2B24;">Start with the receipts — that queue is three months old.</div>
    </div>
  </div>

  <div style="position: absolute; inset: 0; background: radial-gradient(ellipse 78% 55% at 50% 50%, rgba(0,0,0,0) 44%, {{vignette}} 100%);"></div>
  <div class="grain"></div>

</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":1080,"height":1920},"palette":{"editor":"enum","default":"esmeralda","options":["bosque","grafito","esmeralda"],"section":"Paleta"},"font":{"editor":"enum","default":"jakarta","options":["jakarta","redhat"],"section":"Tipografía"}}'>
class Component extends DCLogic {
  palettes() {
    return {
      bosque:    { bgTop: '#1A2A22', bgMid: '#132019', bgBot: '#0C1611', ink: '#EDF3EF', ink2: '#93A39A', accent: '#00C853', vignette: 'rgba(9,17,13,0.86)' },
      grafito:   { bgTop: '#212227', bgMid: '#191A1E', bgBot: '#111215', ink: '#F2F3F4', ink2: '#9A9DA4', accent: '#00C853', vignette: 'rgba(13,14,16,0.86)' },
      esmeralda: { bgTop: '#20422F', bgMid: '#173323', bgBot: '#0E2118', ink: '#F4FAF6', ink2: '#A6BFB2', accent: '#00E676', vignette: 'rgba(10,26,18,0.82)' }
    };
  }

  fonts() {
    return {
      jakarta: "'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', sans-serif",
      redhat: "'Red Hat Display', system-ui, -apple-system, 'Segoe UI', sans-serif"
    };
  }

  hexA(hex, a) {
    const h = String(hex || '#00C853').replace('#', '');
    const s = h.length === 3 ? h.split('').map((c) => c + c).join('') : h;
    const n = parseInt(s, 16);
    return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
  }

  renderVals() {
    const p = this.palettes()[this.props.palette] || this.palettes().bosque;
    return {
      font: this.fonts()[this.props.font] || this.fonts().jakarta,
      bgTop: p.bgTop, bgMid: p.bgMid, bgBot: p.bgBot,
      ink: p.ink, ink2: p.ink2, accent: p.accent, vignette: p.vignette,
      bloom: this.hexA(p.accent, 0.10)
    };
  }
}
</script>
</body>
</html>
