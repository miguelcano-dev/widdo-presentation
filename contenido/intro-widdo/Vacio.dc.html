<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Red+Hat+Display:wght@400;500;600;700;800&display=swap">
  <style>
    body { margin: 0; }
    a { color: #00C853; } a:hover { color: #16a34a; }
    .grain {
      position: absolute; inset: 0; pointer-events: none; opacity: 0.06;
      mix-blend-mode: overlay;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>");
      background-size: 160px 160px;
    }
  </style>
</helmet>
<div style="position: relative; width: 1080px; height: 1920px; overflow: hidden; background: linear-gradient(178deg, {{bgTop}} 0%, {{bgMid}} 52%, {{bgBot}} 100%); font-family: {{font}};">

  <div style="position: absolute; inset: 0; background: rgba(0,0,0,0.55);"></div>

  <div style="position: absolute; inset: 0; background: radial-gradient(circle 420px at 50% 50%, {{halo}} 0%, rgba(0,0,0,0) 74%);"></div>

  <div style="position: absolute; left: 50%; top: 50%; width: {{dot}}px; height: {{dot}}px; transform: translate(-50%, -50%); border-radius: 50%; background: {{accent}}; box-shadow: 0 0 30px 7px {{glowCore}}, 0 0 110px 30px {{glowWide}};"></div>

  <div style="position: absolute; inset: 0; background: radial-gradient(ellipse 78% 55% at 50% 50%, rgba(0,0,0,0) 44%, {{vignette}} 100%);"></div>
  <div class="grain"></div>

</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":1080,"height":1920},"palette":{"editor":"enum","default":"esmeralda","options":["bosque","grafito","esmeralda"],"section":"Paleta"},"font":{"editor":"enum","default":"jakarta","options":["jakarta","redhat"],"section":"Tipografía"},"dot":{"editor":"int","default":16,"min":4,"max":48,"step":2,"unit":"px","section":"Vacío"}}'>
class Component extends DCLogic {
  palettes() {
    return {
      bosque:    { bgTop: '#1A2A22', bgMid: '#132019', bgBot: '#0C1611', accent: '#00C853', vignette: 'rgba(9,17,13,0.86)' },
      grafito:   { bgTop: '#212227', bgMid: '#191A1E', bgBot: '#111215', accent: '#00C853', vignette: 'rgba(13,14,16,0.86)' },
      esmeralda: { bgTop: '#20422F', bgMid: '#173323', bgBot: '#0E2118', accent: '#00E676', vignette: 'rgba(10,26,18,0.82)' }
    };
  }

  fonts() {
    return {
      jakarta: "'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', sans-serif",
      redhat: "'Red Hat Display', system-ui, -apple-system, 'Segoe UI', sans-serif"
    };
  }

  hexA(hex, a) {
    const h = String(hex || '#00C853').replace('#', '');
    const s = h.length === 3 ? h.split('').map((c) => c + c).join('') : h;
    const n = parseInt(s, 16);
    return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
  }

  renderVals() {
    const p = this.palettes()[this.props.palette] || this.palettes().bosque;
    return {
      font: this.fonts()[this.props.font] || this.fonts().jakarta,
      bgTop: p.bgTop, bgMid: p.bgMid, bgBot: p.bgBot,
      accent: p.accent, vignette: p.vignette,
      dot: this.props.dot ?? 16,
      halo: this.hexA(p.accent, 0.06),
      glowCore: this.hexA(p.accent, 0.62),
      glowWide: this.hexA(p.accent, 0.2)
    };
  }
}
</script>
</body>
</html>
