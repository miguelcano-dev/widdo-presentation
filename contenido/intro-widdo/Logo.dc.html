<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Red+Hat+Display:wght@400;500;600;700;800&display=swap">
  <style>
    body { margin: 0; }
    a { color: #00C853; } a:hover { color: #16a34a; }
    .grain {
      position: absolute; inset: 0; pointer-events: none; opacity: 0.06;
      mix-blend-mode: overlay;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>");
      background-size: 160px 160px;
    }
  </style>
</helmet>
<div style="position: relative; width: 1080px; height: 1920px; overflow: hidden; background: linear-gradient(178deg, {{bgTop}} 0%, {{bgMid}} 52%, {{bgBot}} 100%); font-family: {{font}};">

  <div style="position: absolute; inset: 0; background: radial-gradient(circle 660px at 50% 50%, {{bloom}} 0%, rgba(0,0,0,0) 70%);"></div>

  <sc-for list="{{rings}}" as="r" hint-placeholder-count="4">
    <div style="position: absolute; left: 50%; top: 50%; width: {{r.d}}px; height: {{r.d}}px; transform: translate(-50%, -50%); border-radius: 50%; border: {{r.w}}px solid {{r.c}};"></div>
  </sc-for>

  <div style="position: absolute; left: 50%; top: 50%; width: 392px; height: 392px; transform: translate(-50%, -50%); border-radius: 50%; box-shadow: 0 0 0 3px {{ring}}, 0 0 140px 34px {{halo}}, 0 44px 96px rgba(0,0,0,0.5);">
    <svg viewBox="0 0 375 375" width="392" height="392" style="display: block;">
      <circle cx="187.5" cy="187.5" r="176.72" fill="{{mark}}"></circle>
      <path fill="#ffffff" d="M 265.171875 107.988281 L 231.988281 189.648438 L 187.390625 103.898438 L 142.574219 189.648438 L 121.308594 230.339844 L 138.265625 271.09375 L 187.390625 177.582031 L 236.085938 271.09375 L 304.597656 107.988281 Z M 265.171875 107.988281 "></path>
      <path fill="#ffffff" d="M 136.859375 175.390625 L 109.828125 107.988281 L 70.398438 107.988281 L 115.472656 216.3125 Z M 136.859375 175.390625 "></path>
      <circle cx="306.8" cy="270.05" r="9.46" fill="#ffffff"></circle>
    </svg>
  </div>

  <div style="position: absolute; inset: 0; background: radial-gradient(ellipse 78% 55% at 50% 50%, rgba(0,0,0,0) 44%, {{vignette}} 100%);"></div>
  <div class="grain"></div>

</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":1080,"height":1920},"palette":{"editor":"enum","default":"esmeralda","options":["bosque","grafito","esmeralda"],"section":"Paleta"},"font":{"editor":"enum","default":"jakarta","options":["jakarta","redhat"],"section":"Tipografía"}}'>
class Component extends DCLogic {
  palettes() {
    return {
      bosque:    { bgTop: '#1A2A22', bgMid: '#132019', bgBot: '#0C1611', accent: '#00C853', mark: '#16a34a', vignette: 'rgba(9,17,13,0.86)' },
      grafito:   { bgTop: '#212227', bgMid: '#191A1E', bgBot: '#111215', accent: '#00C853', mark: '#16a34a', vignette: 'rgba(13,14,16,0.86)' },
      esmeralda: { bgTop: '#20422F', bgMid: '#173323', bgBot: '#0E2118', accent: '#00E676', mark: '#16a34a', vignette: 'rgba(10,26,18,0.82)' }
    };
  }

  fonts() {
    return {
      jakarta: "'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', sans-serif",
      redhat: "'Red Hat Display', system-ui, -apple-system, 'Segoe UI', sans-serif"
    };
  }

  hexA(hex, a) {
    const h = String(hex || '#00C853').replace('#', '');
    const s = h.length === 3 ? h.split('').map((c) => c + c).join('') : h;
    const n = parseInt(s, 16);
    return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
  }

  renderVals() {
    const p = this.palettes()[this.props.palette] || this.palettes().bosque;
    return {
      font: this.fonts()[this.props.font] || this.fonts().jakarta,
      bgTop: p.bgTop, bgMid: p.bgMid, bgBot: p.bgBot,
      mark: p.mark, vignette: p.vignette,
      bloom: this.hexA(p.accent, 0.14),
      halo: this.hexA(p.accent, 0.3),
      ring: 'rgba(255,255,255,0.14)',
      rings: [
        { d: 520,  w: 2, c: this.hexA(p.accent, 0.42) },
        { d: 720,  w: 2, c: this.hexA(p.accent, 0.2) },
        { d: 960,  w: 1, c: this.hexA(p.accent, 0.1) },
        { d: 1240, w: 1, c: this.hexA(p.accent, 0.05) }
      ]
    };
  }
}
</script>
</body>
</html>
