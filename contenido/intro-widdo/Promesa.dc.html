<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Red+Hat+Display:wght@400;500;600;700;800&display=swap">
  <style>
    body { margin: 0; }
    a { color: #00C853; } a:hover { color: #16a34a; }
    .grain {
      position: absolute; inset: 0; pointer-events: none; opacity: 0.06;
      mix-blend-mode: overlay;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>");
      background-size: 160px 160px;
    }
  </style>
</helmet>
<div style="position: relative; width: 1080px; height: 1920px; overflow: hidden; background: linear-gradient(178deg, {{bgTop}} 0%, {{bgMid}} 52%, {{bgBot}} 100%); font-family: {{font}};">

  <div style="position: absolute; inset: 0; background: radial-gradient(ellipse 74% 34% at 50% 44%, {{bloom}} 0%, rgba(0,0,0,0) 72%);"></div>

  <div style="position: absolute; left: 0; right: 0; top: 690px; display: flex; flex-direction: column; align-items: center; gap: 34px; padding: 0 92px;">
    <div style="font-size: 60px; font-weight: 500; line-height: 1.2; letter-spacing: -0.028em; color: {{ink2}}; text-align: center;">Widdo doesn&#39;t just<br>store your club.</div>
    <div style="font-size: 148px; font-weight: 700; line-height: 1.0; letter-spacing: -0.05em; color: {{ink}}; text-align: center;">It runs it.</div>
    <div style="width: 88px; height: 4px; border-radius: 2px; background: {{accent}};"></div>
  </div>

  <div style="position: absolute; inset: 0; background: radial-gradient(ellipse 78% 55% at 50% 50%, rgba(0,0,0,0) 44%, {{vignette}} 100%);"></div>
  <div class="grain"></div>

</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":1080,"height":1920},"palette":{"editor":"enum","default":"esmeralda","options":["bosque","grafito","esmeralda"],"section":"Paleta"},"font":{"editor":"enum","default":"jakarta","options":["jakarta","redhat"],"section":"Tipografía"}}'>
class Component extends DCLogic {
  palettes() {
    return {
      bosque:    { bgTop: '#1A2A22', bgMid: '#132019', bgBot: '#0C1611', ink: '#EDF3EF', ink2: '#93A39A', accent: '#00C853', vignette: 'rgba(9,17,13,0.86)' },
      grafito:   { bgTop: '#212227', bgMid: '#191A1E', bgBot: '#111215', ink: '#F2F3F4', ink2: '#9A9DA4', accent: '#00C853', vignette: 'rgba(13,14,16,0.86)' },
      esmeralda: { bgTop: '#20422F', bgMid: '#173323', bgBot: '#0E2118', ink: '#F4FAF6', ink2: '#A6BFB2', accent: '#00E676', vignette: 'rgba(10,26,18,0.82)' }
    };
  }

  fonts() {
    return {
      jakarta: "'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', sans-serif",
      redhat: "'Red Hat Display', system-ui, -apple-system, 'Segoe UI', sans-serif"
    };
  }

  hexA(hex, a) {
    const h = String(hex || '#00C853').replace('#', '');
    const s = h.length === 3 ? h.split('').map((c) => c + c).join('') : h;
    const n = parseInt(s, 16);
    return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
  }

  renderVals() {
    const p = this.palettes()[this.props.palette] || this.palettes().bosque;
    return {
      font: this.fonts()[this.props.font] || this.fonts().jakarta,
      bgTop: p.bgTop, bgMid: p.bgMid, bgBot: p.bgBot,
      ink: p.ink, ink2: p.ink2, accent: p.accent, vignette: p.vignette,
      bloom: this.hexA(p.accent, 0.10)
    };
  }
}
</script>
</body>
</html>
