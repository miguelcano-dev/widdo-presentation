<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080">
<title>Widdo LinkedIn Card</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@400;500;600;700;800;900&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1080px;
    height: 1080px;
    overflow: hidden;
    background: #0A0A0F;
    font-family: 'Red Hat Display', sans-serif;
  }

  .card {
    position: relative;
    width: 1080px;
    height: 1080px;
    background: #0A0A0F;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 100px;
  }

  /* Subtle grid */
  .grid {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(0, 200, 83, 0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0, 200, 83, 0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
  }

  /* Green glow behind the number */
  .glow {
    position: absolute;
    width: 500px;
    height: 500px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(0, 200, 83, 0.08) 0%, transparent 70%);
    top: 15%;
    left: 10%;
    pointer-events: none;
  }

  /* Corner marks */
  .corner-tl {
    position: absolute;
    top: 40px;
    left: 40px;
    width: 32px;
    height: 32px;
    border-top: 2px solid rgba(0, 200, 83, 0.2);
    border-left: 2px solid rgba(0, 200, 83, 0.2);
  }
  .corner-br {
    position: absolute;
    bottom: 40px;
    right: 40px;
    width: 32px;
    height: 32px;
    border-bottom: 2px solid rgba(0, 200, 83, 0.2);
    border-right: 2px solid rgba(0, 200, 83, 0.2);
  }

  /* Top green accent line */
  .top-accent {
    position: absolute;
    top: 0;
    left: 100px;
    width: 80px;
    height: 3px;
    background: #00C853;
    opacity: 0.6;
  }

  .stat {
    font-size: 180px;
    font-weight: 900;
    color: #00C853;
    line-height: 1;
    letter-spacing: -6px;
    margin-bottom: 32px;
    position: relative;
    z-index: 1;
  }

  .headline {
    font-size: 44px;
    font-weight: 700;
    color: #E8E8ED;
    line-height: 1.2;
    max-width: 750px;
    margin-bottom: 28px;
    position: relative;
    z-index: 1;
  }

  .subtext {
    font-size: 22px;
    font-weight: 400;
    color: rgba(232, 232, 237, 0.45);
    line-height: 1.5;
    max-width: 650px;
    position: relative;
    z-index: 1;
  }

  /* Divider line */
  .divider {
    width: 60px;
    height: 3px;
    background: #00C853;
    margin-bottom: 28px;
    opacity: 0.5;
    position: relative;
    z-index: 1;
  }

  /* Logo area bottom-left */
  .logo-area {
    position: absolute;
    bottom: 52px;
    left: 100px;
    display: flex;
    align-items: center;
    gap: 14px;
    z-index: 1;
  }

  .logo-area svg {
    width: 36px;
    height: 36px;
  }

  .logo-area span {
    font-family: 'Red Hat Display', sans-serif;
    font-weight: 800;
    font-size: 20px;
    color: rgba(232, 232, 237, 0.5);
    letter-spacing: -0.3px;
  }

  /* URL bottom-right */
  .url {
    position: absolute;
    bottom: 60px;
    right: 100px;
    font-family: 'Red Hat Display', sans-serif;
    font-weight: 500;
    font-size: 18px;
    color: rgba(232, 232, 237, 0.25);
    z-index: 1;
  }
</style>
</head>
<body>
<div class="card">
  <div class="grid"></div>
  <div class="glow"></div>
  <div class="corner-tl"></div>
  <div class="corner-br"></div>
  <div class="top-accent"></div>

  <div class="stat">73%</div>
  <div class="headline">of youth sports clubs use zero paid software</div>
  <div class="divider"></div>
  <div class="subtext">Registration in Google Forms. Payments in Venmo. Attendance in a coach's head. This isn't a tech problem — it's an infrastructure gap.</div>

  <div class="logo-area">
    <svg viewBox="0 0 375 375" xmlns="http://www.w3.org/2000/svg">
      <circle cx="187.5" cy="187.5" r="176.7" fill="#16a34a"/>
      <path fill="#ffffff" d="M 265.17 107.99 L 231.99 189.65 L 187.39 103.9 L 142.57 189.65 L 121.31 230.34 L 138.27 271.09 L 187.39 177.58 L 236.09 271.09 L 304.6 107.99 Z"/>
      <path fill="#ffffff" d="M 136.86 175.39 L 109.83 107.99 L 70.4 107.99 L 115.47 216.31 Z"/>
      <circle cx="306.8" cy="270.05" r="9.46" fill="#ffffff"/>
    </svg>
    <span>Widdo</span>
  </div>

  <div class="url">widdo.co</div>
</div>
</body>
</html>
