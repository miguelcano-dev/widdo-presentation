<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:#04120a}
  .canvas{position:relative;width:1600px;height:1990px;overflow:hidden}
  .bg{
    position:absolute; inset:0;
    background:
      radial-gradient(ellipse 1000px 780px at 18% 12%, rgba(60,220,95,.30), transparent 66%),
      radial-gradient(ellipse 1100px 860px at 90% 28%, rgba(38,175,76,.26), transparent 64%),
      radial-gradient(ellipse 1000px 800px at 8% 72%,  rgba(42,190,84,.24), transparent 64%),
      radial-gradient(ellipse 1200px 950px at 96% 88%, rgba(32,160,70,.22), transparent 62%),
      radial-gradient(ellipse 800px 600px at 50% 50%,  rgba(20,110,48,.20), transparent 70%),
      linear-gradient(160deg,#0a2d15 0%,#061c0d 45%,#0a2812 100%);
  }
  .bg-grunge{
    position:absolute; inset:0; opacity:.9;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='700' height='700'><filter id='g'><feTurbulence type='fractalNoise' baseFrequency='0.012' numOctaves='5' seed='7'/><feColorMatrix type='saturate' values='0'/><feComponentTransfer><feFuncA type='discrete' tableValues='0 0 0 .35 .6 .85 1'/></feComponentTransfer></filter><rect width='700' height='700' filter='url(%23g)'/></svg>");
    background-size:1400px 1400px;
    mix-blend-mode:multiply;
  }
  .bg-halftone{
    position:absolute; inset:0;
    background-image:radial-gradient(rgba(0,0,0,.28) 2px, transparent 2.3px);
    background-size:12px 12px;
    mix-blend-mode:multiply; opacity:.75;
  }
  .bg-noise{
    position:absolute; inset:0; opacity:.5;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4'/><feColorMatrix type='saturate' values='0'/></filter><rect width='300' height='300' filter='url(%23n)' opacity='0.5'/></svg>");
    mix-blend-mode:soft-light;
  }
  .vignette{
    position:absolute; inset:0;
    background:radial-gradient(ellipse 1300px 1500px at 50% 50%, transparent 40%, rgba(0,0,0,.55) 100%);
  }
  .tear{
    position:absolute; left:-20px; right:-20px; height:96px;
    background:rgba(0,0,0,.40); mix-blend-mode:multiply;
    clip-path:polygon(0 22%, 5% 8%, 11% 30%, 17% 12%, 24% 34%, 31% 14%, 38% 32%, 45% 10%, 52% 30%, 59% 12%, 66% 33%, 73% 11%, 80% 31%, 87% 13%, 94% 32%, 100% 16%,
                      100% 82%, 93% 96%, 86% 74%, 79% 92%, 72% 70%, 65% 90%, 58% 68%, 51% 90%, 44% 70%, 37% 92%, 30% 72%, 23% 94%, 16% 72%, 9% 90%, 3% 70%, 0 88%);
  }
</style></head>
<body>
  <div class="canvas">
    <div class="bg"></div>
    <div class="bg-grunge"></div>
    <div class="tear" style="top:512px"></div>
    <div class="tear" style="top:1210px"></div>
    <div class="bg-halftone"></div>
    <div class="bg-noise"></div>
    <div class="vignette"></div>
  </div>
</body></html>
